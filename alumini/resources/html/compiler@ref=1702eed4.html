ML, include styles, add scripts if needed, and click Run to see the result instantly.\u003c/p\u003e\n\u003ch3 dir=\"ltr\"\u003eAbout HTML\u003c/h3\u003e\n\u003cp dir=\"ltr\"\u003e\u003ca href=\"https://www.wscubetech.com/resources/html\" target=\"_blank\"\u003eHTML\u003c/a\u003e (HyperText Markup Language) is the basic language used to create web pages. It was created by Tim Berners‑Lee in 1991 and is now the backbone of almost every website. With HTML, you define the structure of a page, such as headings, paragraphs, links, images, and lists.\u003c/p\u003e\n\u003ch3 dir=\"ltr\"\u003eSyntax Help: HTML Fundamentals\u003cbr\u003e\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n        \u003cp dir=\"ltr\" role=\"presentation\"\u003eAny HTML document must start with the declaration:\u003c/p\u003e\n    \u003c/li\u003e\n\u003c/ul\u003e\n\u003cpre\u003e\u003ccode class=\"javascript hljs\"\u003e\u0026lt;!DOCTYPE html\u0026gt;\u003c/code\u003e\u003cbr\u003e\u003c/pre\u003e\n\u003cul\u003e\n    \u003cli\u003e\u003cspan style=\"font-size: inherit;\"\u003eHTML documents begin with \u0026lt;html\u0026gt; and end with \u0026lt;/html\u0026gt;.\u003c/span\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cspan style=\"font-size: inherit;\"\u003eHeadings are written using \u0026lt;h1\u0026gt; to \u0026lt;h6\u0026gt;, where \u0026lt;h1\u0026gt; is the most important.\u003c/span\u003e\u003c/li\u003e\n    \u003cli\u003e\u003cspan style=\"font-size: inherit;\"\u003eParagraphs go inside \u0026lt;p\u0026gt; ... \u0026lt;/p\u0026gt;.\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"javascript hljs\"\u003e\u0026lt;a href=\u003cspan class=\"hljs-string\"\u003e\u003cspan class=\"hljs-string\"\u003e\u003cspan class=\"hljs-string\"\u003e\"https://www.wscubetech.com/resources/html/compiler\"\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u0026gt;Try HTML Compiler\u0026lt;/a\u0026gt;\u003cbr\u003e\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n    \u003cli\u003eImages are defined with the \u0026lt;img\u0026gt; tag, using the src attribute.\u003c/li\u003e\n    \u003cli\u003eButtons are created using \u0026lt;button\u0026gt; ... \u0026lt;/button\u0026gt;.\u003c/li\u003e\n    \u003cli\u003eLists can be created with:\u003cul\u003e\n            \u003cli\u003e\u0026lt;ul\u0026gt; for unordered lists\u003c/li\u003e\n            \u003cli\u003e\u0026lt;ol\u0026gt; for ordered lists\u003c/li\u003e\n            \u003cli\u003e\u0026lt;li\u0026gt; for list items\u003c/li\u003e\n        \u003c/ul\u003e\n    \u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eYou can also include style rules to make your page more attractive and add scripts to make it interactive.\u003c/p\u003e\n\u003ch3 dir=\"ltr\"\u003eHTML Elements and Attributes\u003c/h3\u003e\n\u003cul\u003e\n    \u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n        \u003cp dir=\"ltr\" role=\"presentation\"\u003eAn \u003ca href=\"https://www.wscubetech.com/resources/html/elements\" target=\"_blank\"\u003eHTML element\u003c/a\u003e includes everything from the start tag to the end tag.\u003c/p\u003e\n    \u003c/li\u003e\n    \u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n        \u003cp dir=\"ltr\" role=\"presentation\"\u003eThe text placed between these tags is called the element content.\u003c/p\u003e\n    \u003c/li\u003e\n    \u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n        \u003cp dir=\"ltr\" role=\"presentation\"\u003eAlthough you can technically use any word as a tag name, it’s best to choose meaningful names related to the content.\u003c/p\u003e\n    \u003c/li\u003e\n    \u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n        \u003cp dir=\"ltr\" role=\"presentation\"\u003eAlways remember to close your tags properly.\u003c/p\u003e\n    \u003c/li\u003e\n    \u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n        \u003cp dir=\"ltr\" role=\"presentation\"\u003eSome elements don’t have content; these are called empty elements.\u003c/p\u003e\n    \u003c/li\u003e\n    \u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n        \u003cp dir=\"ltr\" role=\"presentation\"\u003eHTML elements can also have attributes, which provide extra information. Attributes are always written in the start tag.\u003c/p\u003e\n    \u003c/li\u003e\n\u003c/ul\u003e\n\u003cpre\u003e\u003ccode class=\"javascript hljs\"\u003e\u0026lt;a href=\u003cspan class=\"hljs-string\"\u003e\u003cspan class=\"hljs-string\"\u003e\u003cspan class=\"hljs-string\"\u003e\"https://www.wscubetech.com/resources/html/compiler\"\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u0026gt;HTML online compiler\u0026lt;/a\u0026gt;\u003cbr\u003e\u003cbr\u003e\u003c/code\u003e\u003cbr\u003e\u003c/pre\u003e\n\u003ch2 dir=\"ltr\"\u003eAbout CSS\u003c/h2\u003e\n\u003cp dir=\"ltr\"\u003eCSS (Cascading Style Sheets) is used to style web pages by changing colors, fonts, spacing, and layouts. With an HTML and CSS compiler, you can easily design attractive and responsive web pages.\u003c/p\u003e\n\u003ch3 dir=\"ltr\"\u003eExample CSS Code\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"javascript hljs\"\u003ebody {\n  \u003cspan class=\"hljs-attr\"\u003e\u003cspan class=\"hljs-attr\"\u003e\u003cspan class=\"hljs-attr\"\u003epadding\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e: 20px;\n  background-color: #f4f4f9;\n}\n.title {\n  \u003cspan class=\"hljs-attr\"\u003e\u003cspan class=\"hljs-attr\"\u003e\u003cspan class=\"hljs-attr\"\u003ecolor\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e: #007BFF;\n  font-family: Arial, sans-serif;\n  text-align: center;\n}\n\u003c/code\u003e\u003cbr\u003e\u003c/pre\u003e\n\u003cp dir=\"ltr\"\u003eThe above example adds padding to the page, applies a light background, and styles text in the .title class with blue color, centered alignment, and a neat font.\u003c/p\u003e\n\u003ch2 dir=\"ltr\"\u003eHTML Tables\u003c/h2\u003e\n\u003cp dir=\"ltr\"\u003eIn HTML, tables are created using the \u0026lt;table\u0026gt; tag.\u003c/p\u003e\n\u003cul\u003e\n    \u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n        \u003cp dir=\"ltr\" role=\"presentation\"\u003eEach row is placed inside the \u0026lt;tr\u0026gt; tag.\u003c/p\u003e\n    \u003c/li\u003e\n    \u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n        \u003cp dir=\"ltr\" role=\"presentation\"\u003eColumn headings go in the \u0026lt;th\u0026gt; tag.\u003c/p\u003e\n    \u003c/li\u003e\n    \u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n        \u003cp dir=\"ltr\" role=\"presentation\"\u003eTable data is added within the \u0026lt;td\u0026gt; tag.\u003c/p\u003e\n    \u003c/li\u003e\n    \u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n        \u003cp dir=\"ltr\" role=\"presentation\"\u003eTo give your table a title, use the \u0026lt;caption\u0026gt; tag.\u003c/p\u003e\n    \u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eExample HTML Table\u003cbr\u003e\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"javascript hljs\"\u003e\u0026lt;table border=\u003cspan class=\"hljs-string\"\u003e\u003cspan class=\"hljs-string\"\u003e\u003cspan class=\"hljs-string\"\u003e\"1\"\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u0026gt;\n  \u003cspan class=\"xml\"\u003e\u003cspan class=\"hljs-tag\"\u003e\u003cspan class=\"xml\"\u003e\u003cspan class=\"hljs-tag\"\u003e\u003cspan class=\"xml\"\u003e\u003cspan class=\"hljs-tag\"\u003e\u0026lt;\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"hljs-name\"\u003e\u003cspan class=\"xml\"\u003e\u003cspan class=\"hljs-tag\"\u003e\u003cspan class=\"hljs-name\"\u003e\u003cspan class=\"xml\"\u003e\u003cspan class=\"hljs-tag\"\u003e\u003cspan class=\"hljs-name\"\u003ecaption\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"xml\"\u003e\u003cspan class=\"hljs-tag\"\u003e\u003cspan class=\"xml\"\u003e\u003cspan class=\"hljs-tag\"\u003e\u0026gt;\u003c/span\u003e\u003c/span\u003e\u003c/span\u0
