<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" fill="none" aria-hidden="true" focusable="false"><defs><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#00B9F1" stop-opacity=".34"/><stop offset="1" stop-color="#00B9F1" stop-opacity="0"/></radialGradient><linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#194CFF"/><stop offset="1" stop-color="#00B9F1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000825" flood-opacity=".36"/></filter></defs>
<style>.spin{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite}.spin2{animation-duration:45s}.orbit{transform-origin:280px 260px;animation:spin 80s linear infinite}.ctr{transform-box:fill-box;transform-origin:center;animation:unspin 80s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes unspin{to{transform:rotate(-360deg)}}@media (prefers-reduced-motion:reduce){.spin,.orbit,.ctr{animation:none}}</style>
<circle cx="280" cy="260" r="246" fill="url(#glow)"/>
<circle class="spin" cx="280" cy="260" r="236" stroke="#fff" stroke-opacity=".13" stroke-dasharray="3 9" stroke-width="1.6"/>
<circle cx="280" cy="260" r="158" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/>
