<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 390" width="450" height="390"
     role="img" aria-label="A phone showing a post, with hearts floating up and a comment appearing">
  <title>Social media marketing</title>
  <style>
    .fl { transform-box: fill-box; transform-origin: center }
    .h1 { animation: up 4.4s ease-in-out infinite }
    .h2 { animation: up 4.4s ease-in-out .8s infinite }
    .h3 { animation: up 4.4s ease-in-out 1.7s infinite }
    .bubble { transform-box: fill-box; transform-origin: 0 100%; animation: pop 4.4s ease-out 1.1s infinite }
    .likebar { animation: grow 4.4s ease-in-out infinite }
    .phone { animation: sway 5s ease-in-out infinite alternate }
    .dot1 { animation: blink 4.4s ease-in-out infinite }
    .dot2 { animation: blink 4.4s ease-in-out .2s infinite }
    .dot3 { animation: blink 4.4s ease-in-out .4s infinite }

    @keyframes up {
      0%   { transform: translateY(0) scale(.6); opacity: 0 }
      15%  { transform: translateY(-14px) scale(1); opacity: 1 }
      70%  { transform: translateY(-96px) scale(1); opacity: .9 }
      100% { transform: translateY(-150px) scale(.8); opacity: 0 }
    }
    @keyframes pop {
      0%, 6% { transform: scale(0); opacity: 0 }
      16%    { transform: scale(1.1); opacity: 1 }
      24%    { transform: scale(1) }
      82%    { transform: scale(1); opacity: 1 }
      92%, 100% { transform: scale(.85); opacity: 0 }
    }
    @keyframes grow { 0% { width: 0 } 45% { width: 84px } 85% { width: 84px } 100% { width: 0 } }
    @keyframes sway { from { transform: translateY(-5px) } to { transform: translateY(5px) } }
    @keyframes blink { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }

    @media (prefers-reduced-motion: reduce) {
      .h1, .h2, .h3, .bubble, .likebar, .phone, .dot1, .dot2, .dot3 { animation: none }
      .h1, .h2, .h3 { opacity: 1; transform: translateY(-40px) }
      .bubble { opacity: 1; transform: none }
      .likebar { width: 84px }
      .dot1, .dot2, .dot3 { opacity: 1 }
    }
  </style>

  <defs>
    <pattern id="d3" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#0B1D3A" opacity=".055"/>
    </pattern>
    <filter id="l3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B1D3A" flood-opacity=".14"/>
    </filter>
    <filter id="l3s" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#002E6E" flood-opacity=".22"/>
    </filter>
    <linearGradient id="shot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00B9F1" stop-opacity=".9"/>
      <stop offset="1" stop-color="#194CFF" stop-opacity=".85"/>
    </linearGradient>
  </defs>

  <rect width="450" height="390" rx="26" fill="#EEF4FC"/>
  <rect width="450" height="390" rx="26" fill="url(#d3)"/>

  <!-- phone -->
  <g class="phone fl">
    <g filter="url(#l3)"><rect x="150" y="42" width="180" height="306" rx="26" fill="#fff"/></g>
    <rect x="150" y="42" width="180" height="306" rx="26" fill="none" stroke="#E6EDF8" stroke-width="1.5"/>
    <rect x="206" y="54" width="68" height="7" rx="3.5" fill="#E3EBF6"/>

    <!-- post header -->
    <circle cx="180" cy="94" r="14" fill="#002E6E"/>
    <rect x="202" y="86" width="66" height="8" rx="4" fill="#DCE6F4"/>
    <rect x="202" y="100" width="42" height="6" rx="3" fill="#E9EFF8"/>

    <!-- post image -->
    <rect x="166" y="120" width="148" height="104" rx="14" fill="url(#shot)"/>
    <circle cx="196" cy="152" r="11" fill="#fff" opacity=".85"/>
    <path d="M166 206 l34 -32 24 22 30 -34 60 46 v6 a14 14 0 0 1 -14 14 H180 a14 14 0 0 1 -14 -14Z" fill="#fff" opacity=".28"/>

    <!-- like row -->
    <path class="fl" d="M180 244c-7-5-10-8-10-12a5 5 0 0 1 10-2 5 5 0 0 1 10 2c0 4-3 7-10 12Z" fill="#FFC24B"/>
    <rect x="200" y="238" width="84" height="8" rx="4" fill="#EDF2F9"/>
    <rect class="likebar" x="200" y="238" width="84" height="8" rx="4" fill="#00B9F1"/>

    <!-- caption -->
    <rect x="166" y="264" width="120" height="7" rx="3.5" fill="#E7EEF7"/>
    <rect x="166" y="280" width="86" height="7" rx="3.5" fill="#EEF3FA"/>

    <!-- typing dots -->
    <circle class="dot1" cx="176" cy="312" r="4" fill="#A9BDD8"/>
    <circle class="dot2" cx="190" cy="312" r="4" fill="#A9BDD8"/>
    <circle class="dot3" cx="204" cy="312" r="4" fill="#A9BDD8"/>
  </g>

  <!-- floating hearts -->
  <g fill="#00B9F1">
    <path class="h1 fl" d="M96 300c-13-9-19-15-19-23a9.5 9.5 0 0 1 19-4 9.5 9.5 0 0 1 19 4c0 8-6 14-19 23Z"/>
    <path class="h2 fl" d="M372 306c-10-7-15-12-15-18a7.5 7.5 0 0 1 15-3 7.5 7.5 0 0 1 15 3c0 6-5 11-15 18Z" fill="#194CFF"/>
    <path class="h3 fl" d="M118 322c-8-5-11-9-11-13a5.5 5.5 0 0 1 11-2 5.5 5.5 0 0 1 11 2c0 4-3 8-11 13Z" fill="#FFC24B"/>
  </g>

  <!-- comment bubble -->
  <g class="bubble" filter="url(#l3s)">
    <path d="M352 96h60a14 14 0 0 1 14 14v34a14 14 0 0 1-14 14h-34l-16 14v-14h-10a14 14 0 0 1-14-14v-34a14 14 0 0 1 14-14Z" fill="#002E6E"/>
    <rect x="352" y="116" width="52" height="7" rx="3.5" fill="#fff" opacity=".9"/>
    <rect x="352" y="132" width="34" height="7" rx="3.5" fill="#00B9F1"/>
  </g>
</svg>
