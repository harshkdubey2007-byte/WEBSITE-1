<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 390" width="450" height="390"
     role="img" aria-label="A search result climbing from third place to first">
  <title>Search optimisation</title>
  <style>
    .fl { transform-box: fill-box; transform-origin: center }
    /* the winning result travels two rows up, pushing the others down */
    .win  { transform-box: fill-box; animation: climb 5s cubic-bezier(.5,0,.25,1) infinite }
    .r1   { transform-box: fill-box; animation: down1 5s cubic-bezier(.5,0,.25,1) infinite }
    .r2   { transform-box: fill-box; animation: down1 5s cubic-bezier(.5,0,.25,1) infinite }
    .caret{ animation: blink 1.1s steps(1) infinite }
    .glass{ animation: sweep 5s ease-in-out infinite }
    .spark{ transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite }
    .spark2{ transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out .9s infinite }

    @keyframes climb {
      0%, 22%  { transform: translateY(0) }
      52%, 88% { transform: translateY(-136px) }
      100%     { transform: translateY(0) }
    }
    @keyframes down1 {
      0%, 22%  { transform: translateY(0) }
      52%, 88% { transform: translateY(68px) }
      100%     { transform: translateY(0) }
    }
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes sweep {
      0%, 10% { transform: translateX(0) }
      30%     { transform: translateX(96px) }
      60%     { transform: translateX(28px) }
      100%    { transform: translateX(0) }
    }
    @keyframes twinkle { 0%, 100% { transform: scale(.7); opacity: .45 } 50% { transform: scale(1.15); opacity: 1 } }

    @media (prefers-reduced-motion: reduce) {
      .win, .r1, .r2, .caret, .glass, .spark, .spark2 { animation: none }
      .win { transform: translateY(-136px) }
      .r1, .r2 { transform: translateY(68px) }
      .caret, .spark, .spark2 { opacity: 1 }
    }
  </style>

  <defs>
    <pattern id="d4" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#0B1D3A" opacity=".055"/>
    </pattern>
    <filter id="l4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1D3A" flood-opacity=".12"/>
    </filter>
    <filter id="l4w" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#194CFF" flood-opacity=".3"/>
    </filter>
    <clipPath id="rows"><rect x="52" y="146" width="346" height="212" rx="16"/></clipPath>
  </defs>

  <rect width="450" height="390" rx="26" fill="#EEF4FC"/>
  <rect width="450" height="390" rx="26" fill="url(#d4)"/>

  <!-- search field -->
  <g filter="url(#l4)"><rect x="52" y="52" width="346" height="62" rx="20" fill="#fff"/></g>
  <rect x="52" y="52" width="346" height="62" rx="20" fill="none" stroke="#E6EDF8" stroke-width="1.5"/>
  <g class="glass">
    <circle cx="90" cy="83" r="13" fill="none" stroke="#002E6E" stroke-width="4"/>
    <path d="M100 93 l10 10" stroke="#002E6E" stroke-width="4" stroke-linecap="round"/>
  </g>
  <rect x="124" y="77" width="150" height="10" rx="5" fill="#DCE6F4"/>
  <rect class="caret" x="280" y="71" width="3" height="22" rx="1.5" fill="#194CFF"/>
  <path class="spark" d="M356 68 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z" fill="#FFC24B"/>
  <path class="spark2" d="M378 90 l2.6 6 6 2.6 -6 2.6 -2.6 6 -2.6 -6 -6 -2.6 6 -2.6 Z" fill="#00B9F1"/>

  <!-- results -->
  <g clip-path="url(#rows)">
    <!-- row 1 -->
    <g class="r1">
      <rect x="52" y="146" width="346" height="58" rx="16" fill="#fff" stroke="#E6EDF8" stroke-width="1.5"/>
      <circle cx="84" cy="175" r="14" fill="#EDF2FA"/>
      <text x="84" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7C93B5">2</text>
      <rect x="112" y="162" width="150" height="9" rx="4.5" fill="#DDE7F4"/>
      <rect x="112" y="180" width="96" height="7" rx="3.5" fill="#EBF1F8"/>
    </g>
    <!-- row 2 -->
    <g class="r2">
      <rect x="52" y="214" width="346" height="58" rx="16" fill="#fff" stroke="#E6EDF8" stroke-width="1.5"/>
      <circle cx="84" cy="243" r="14" fill="#EDF2FA"/>
      <text x="84" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7C93B5">3</text>
      <rect x="112" y="230" width="128" height="9" rx="4.5" fill="#DDE7F4"/>
      <rect x="112" y="248" width="80" height="7" rx="3.5" fill="#EBF1F8"/>
    </g>
    <!-- the climber -->
    <g class="win" filter="url(#l4w)">
      <rect x="52" y="282" width="346" height="58" rx="16" fill="#002E6E"/>
      <circle cx="84" cy="311" r="14" fill="#FFC24B"/>
      <text x="84" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0B1D3A">1</text>
      <rect x="112" y="298" width="168" height="9" rx="4.5" fill="#fff" opacity=".92"/>
      <rect x="112" y="316" width="110" height="7" rx="3.5" fill="#00B9F1"/>
      <path d="M368 318 l0 -18 M360 308 l8 -8 8 8" stroke="#00B9F1" stroke-width="3.4"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
</svg>
