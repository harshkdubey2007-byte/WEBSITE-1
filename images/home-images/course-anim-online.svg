<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 390" width="450" height="390"
     role="img" aria-label="A live online class on a laptop: a mentor teaching, learners joining, a progress bar for week 7 of 20, and a certificate badge">
  <title>Live online digital marketing class</title>
  <style>
    .fl1 { animation: float 3.6s ease-in-out infinite alternate; }
    .fl2 { animation: float 3.6s ease-in-out .7s infinite alternate; }
    .fl3 { animation: float 3.6s ease-in-out 1.4s infinite alternate; }
    .live { animation: blink 1.4s ease-in-out infinite; }
    .talk { animation: talk 2.4s ease-in-out infinite; }
    .bar  { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 4.8s ease-in-out infinite; }
    .b2 { animation-delay: .25s } .b3 { animation-delay: .5s } .b4 { animation-delay: .75s }
    .prog { animation: fillbar 7s ease-in-out infinite; }
    .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
    .s2 { animation-delay: .9s } .s3 { animation-delay: 1.7s }

    @keyframes float   { from { transform: translateY(-4px) } to { transform: translateY(4px) } }
    @keyframes blink   { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }
    @keyframes talk    { 0%, 100% { opacity: .15 } 50% { opacity: 1 } }
    @keyframes grow    { 0% { transform: scaleY(.25) } 45%, 85% { transform: scaleY(1) } 100% { transform: scaleY(.25) } }
    @keyframes fillbar { 0% { width: 6px } 60%, 88% { width: 104px } 100% { width: 6px } }
    @keyframes twinkle { 0%, 100% { transform: scale(.6); opacity: .4 } 50% { transform: scale(1.15); opacity: 1 } }

    @media (prefers-reduced-motion: reduce) {
      .fl1, .fl2, .fl3, .live, .talk, .bar, .prog, .spark { animation: none }
      .prog { width: 104px }
    }
  </style>

  <defs>
    <pattern id="onDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#0B1D3A" opacity=".055"/>
    </pattern>
    <linearGradient id="onVid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D5EFF"/><stop offset="1" stop-color="#0A2472"/>
    </linearGradient>
    <linearGradient id="onT1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE8C2"/><stop offset="1" stop-color="#FFC24B"/></linearGradient>
    <linearGradient id="onT2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CFF2FF"/><stop offset="1" stop-color="#5FCFF3"/></linearGradient>
    <linearGradient id="onT3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6DDFF"/><stop offset="1" stop-color="#A98BFF"/></linearGradient>
    <linearGradient id="onProg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#194CFF"/><stop offset="1" stop-color="#00B9F1"/></linearGradient>
    <filter id="onLift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#0B1D3A" flood-opacity=".16"/>
    </filter>
    <filter id="onLiftSm" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#002E6E" flood-opacity=".2"/>
    </filter>
    <clipPath id="onClipVid"><rect x="76" y="88" width="190" height="124" rx="10"/></clipPath>
    <clipPath id="onClipT1"><rect x="274" y="88" width="102" height="36" rx="8"/></clipPath>
    <clipPath id="onClipT2"><rect x="274" y="130" width="102" height="36" rx="8"/></clipPath>
    <clipPath id="onClipT3"><rect x="274" y="172" width="102" height="36" rx="8"/></clipPath>
  </defs>

  <!-- ground -->
  <rect width="450" height="390" rx="26" fill="#EEF4FC"/>
  <rect width="450" height="390" rx="26" fill="url(#onDots)"/>
  <ellipse cx="225" cy="338" rx="172" ry="9" fill="#0B1D3A" opacity=".08"/>

  <!-- laptop -->
  <g transform="translate(0 36)">
    <g filter="url(#onLift)">
      <rect x="58" y="46" width="334" height="222" rx="18" fill="#0B1D3A"/>
    </g>
    <rect x="66" y="54" width="318" height="206" rx="10" fill="#F5F8FE"/>

    <!-- window bar -->
    <circle cx="80" cy="67" r="4" fill="#FFC24B"/><circle cx="93" cy="67" r="4" fill="#00B9F1"/><circle cx="106" cy="67" r="4" fill="#194CFF" opacity=".6"/>
    <rect x="122" y="60" width="150" height="14" rx="7" fill="#E6EDF9"/>
    <text x="197" y="70.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="9" font-weight="600" fill="#334A7A">Live class · Digital Marketing</text>
    <rect x="326" y="59" width="50" height="16" rx="8" fill="#FF3B4E"/>
    <circle class="live" cx="337" cy="67" r="3" fill="#fff"/>
    <text x="347" y="70.6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="9" font-weight="800" fill="#fff">LIVE</text>

    <!-- mentor video -->
    <rect x="76" y="88" width="190" height="124" rx="10" fill="url(#onVid)"/>
    <g clip-path="url(#onClipVid)">
      <circle cx="250" cy="96" r="46" fill="#fff" opacity=".07"/>
      <circle cx="96" cy="212" r="52" fill="#00B9F1" opacity=".18"/>
      <!-- whiteboard -->
      <rect x="168" y="98" width="88" height="64" rx="7" fill="#fff" opacity=".16"/>
      <text x="176" y="112" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="9" font-weight="700" fill="#fff">ROAS 4.2x</text>
      <g fill="#fff">
        <rect class="bar b1" x="178" y="142" width="12" height="14" rx="3" opacity=".6"/>
        <rect class="bar b2" x="196" y="134" width="12" height="22" rx="3" opacity=".7"/>
        <rect class="bar b3" x="214" y="124" width="12" height="32" rx="3" opacity=".85"/>
        <rect class="bar b4" x="232" y="116" width="12" height="40" rx="3" fill="#FFC24B"/>
      </g>
      <path d="M170 160h84" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/>
      <!-- mentor -->
      <path d="M80 214 C80 184 98 172 118 172 C138 172 156 184 156 214 Z" fill="#00B9F1"/>
      <path d="M106 173 L118 190 L130 173" fill="#fff" opacity=".9"/>
      <rect x="111" y="156" width="14" height="14" rx="5" fill="#F2C6A0"/>
      <circle cx="118" cy="142" r="18" fill="#FFD7B5"/>
      <path d="M99 140 C98 122 110 115 120 115 C133 115 139 125 137 140 C132 131 113 129 99 140 Z" fill="#1B2559"/>
      <circle cx="111" cy="144" r="1.8" fill="#1B2559"/><circle cx="125" cy="144" r="1.8" fill="#1B2559"/>
      <path d="M111 151 Q118 157 125 151" fill="none" stroke="#B5574B" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <rect x="84" y="190" width="56" height="16" rx="8" fill="#0B1D3A" opacity=".62"/>
    <text x="112" y="201.4" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="9" font-weight="600" fill="#fff">Mentor</text>

    <!-- learners -->
    <rect x="274" y="88" width="102" height="36" rx="8" fill="url(#onT1)"/>
    <g clip-path="url(#onClipT1)">
      <circle cx="294" cy="102" r="7" fill="#FFD7B5"/><path d="M280 126 C280 114 287 110 294 110 C301 110 308 114 308 126 Z" fill="#194CFF"/>
      <path d="M287 100 C287 93 293 91 296 91 C301 91 303 96 302 100 C299 96 291 96 287 100 Z" fill="#1B2559"/>
    </g>
    <text x="318" y="110" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="9" font-weight="700" fill="#5B3A00">Riya</text>

    <rect x="274" y="130" width="102" height="36" rx="8" fill="url(#onT2)"/>
    <g clip-path="url(#onClipT2)">
      <circle cx="294" cy="144" r="7" fill="#F2C6A0"/><path d="M280 168 C280 156 287 152 294 152 C301 152 308 156 308 168 Z" fill="#0A2472"/>
      <path d="M287 142 C287 135 292 133 295 133 C300 133 302 137 301 142 C298 138 291 138 287 142 Z" fill="#3A2A1D"/>
    </g>
    <text x="318" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="9" font-weight="700" fill="#06415C">Aman</text>
    <rect class="talk" x="274" y="130" width="102" height="36" rx="8" fill="none" stroke="#19D3A2" stroke-width="2.4"/>

    <rect x="274" y="172" width="102" height="36" rx="8" fill="url(#onT3)"/>
    <g clip-path="url(#onClipT3)">
      <circle cx="294" cy="186" r="7" fill="#FFD7B5"/><path d="M280 210 C280 198 287 194 294 194 C301 194 308 198 308 210 Z" fill="#FF5C8A"/>
      <path d="M286 188 C285 180 291 177 295 177 C301 177 304 182 302 190 C300 184 291 183 286 188 Z" fill="#2B1A3F"/>
    </g>
    <text x="318" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="9" font-weight="700" fill="#3C2480">Sana</text>

    <!-- progress -->
    <text x="76" y="233" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#002E6E">Week 7 of 20</text>
    <text x="376" y="233" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="9" font-weight="600" fill="#5B6B88">Module 3 · SEO</text>
    <rect x="76" y="239" width="300" height="8" rx="4" fill="#E1E9F6"/>
    <rect class="prog" x="76" y="239" width="104" height="8" rx="4" fill="url(#onProg)"/>

    <!-- base -->
    <path d="M30 268 H420 L409 281 Q407 286 401 286 H49 Q43 286 41 281 Z" fill="#D3DCEB"/>
    <rect x="195" y="268" width="60" height="6" rx="3" fill="#B7C4DA"/>
  </g>

  <!-- floating cards -->
  <g class="fl1" filter="url(#onLiftSm)">
    <rect x="24" y="20" width="118" height="30" rx="15" fill="#fff"/>
    <circle cx="44" cy="35" r="8" fill="none" stroke="#194CFF" stroke-width="1.8"/>
    <ellipse cx="44" cy="35" rx="3.4" ry="8" fill="none" stroke="#194CFF" stroke-width="1.5"/>
    <path d="M36 35h16" stroke="#194CFF" stroke-width="1.5"/>
    <text x="58" y="39.4" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#002E6E">100% Online</text>
  </g>

  <g class="fl2" filter="url(#onLiftSm)">
    <rect x="284" y="12" width="148" height="52" rx="14" fill="#fff"/>
    <circle cx="302" cy="38" r="10" fill="url(#onT2)"/>
    <circle cx="302" cy="35" r="3.6" fill="#F2C6A0"/><path d="M295 44 C295 39 298 38 302 38 C306 38 309 39 309 44 Z" fill="#0A2472"/>
    <text x="318" y="35" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="9" font-weight="700" fill="#1B2559">Can AI write ad hooks?</text>
    <text x="318" y="49" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="8.5" font-weight="500" fill="#5B6B88">Yes! Let's try it live</text>
    <path d="M300 64 l-6 9 l13 -5 z" fill="#fff"/>
  </g>

  <g class="fl3" filter="url(#onLiftSm)">
    <rect x="16" y="326" width="136" height="42" rx="14" fill="#fff"/>
    <circle cx="38" cy="347" r="12" fill="#194CFF"/>
    <path d="M34.5 341.5 L43.5 347 L34.5 352.5 Z" fill="#fff"/>
    <text x="57" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#002E6E">Watch anytime</text>
    <text x="57" y="358" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="8.5" font-weight="500" fill="#5B6B88">Every class recorded</text>
  </g>

  <g class="fl1" filter="url(#onLiftSm)">
    <rect x="298" y="326" width="136" height="42" rx="14" fill="#fff"/>
    <circle cx="320" cy="347" r="12" fill="#FFC24B"/>
    <path d="M314.5 347.5 l4 4 l7.5 -8" fill="none" stroke="#0B1D3A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="339" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#002E6E">Certificate</text>
    <text x="339" y="358" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="8.5" font-weight="500" fill="#5B6B88">Shareable badge</text>
  </g>

  <!-- sparkles -->
  <path class="spark" d="M196 22 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill="#FFC24B"/>
  <path class="spark s2" d="M244 52 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" fill="#00B9F1"/>
  <path class="spark s3" d="M164 64 l1.6 4 l4 1.6 l-4 1.6 l-1.6 4 l-1.6 -4 l-4 -1.6 l4 -1.6 z" fill="#194CFF"/>
</svg>
