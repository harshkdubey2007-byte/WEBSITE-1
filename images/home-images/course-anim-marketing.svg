<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 390" width="450" height="390"
     role="img" aria-label="A marketing dashboard with an engagement curve rising across it">
  <title>Marketing growth</title>
  <style>
    .fl { transform-box: fill-box; transform-origin: center; }
    .pt { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pop 5s ease-in-out infinite; }

    .line { stroke-dasharray: 310; animation: draw 5s ease-in-out infinite; }
    .area { opacity: 0; animation: fill 5s ease-in-out infinite; }

    .b1 { animation: float 3.4s ease-in-out infinite alternate; }
    .b2 { animation: float 3.4s ease-in-out .5s infinite alternate; }
    .b3 { animation: float 3.4s ease-in-out 1s infinite alternate; }
    .chip { animation: beat 2.8s ease-in-out infinite; }

    @keyframes draw {
      0%   { stroke-dashoffset: 310; opacity: 1 }
      52%  { stroke-dashoffset: 0;   opacity: 1 }
      88%  { stroke-dashoffset: 0;   opacity: 1 }
      96%  { stroke-dashoffset: 0;   opacity: 0 }
      97%  { stroke-dashoffset: 310; opacity: 0 }
      100% { stroke-dashoffset: 310; opacity: 1 }
    }
    @keyframes fill {
      0% { opacity: 0 } 55% { opacity: 1 } 88% { opacity: 1 } 96%, 100% { opacity: 0 }
    }
    @keyframes pop {
      0%, 8% { opacity: 0; transform: scale(.3) }
      18%    { opacity: 1; transform: scale(1.25) }
      26%    { opacity: 1; transform: scale(1) }
      88%    { opacity: 1; transform: scale(1) }
      96%, 100% { opacity: 0; transform: scale(.3) }
    }
    @keyframes float { from { transform: translateY(-4px) } to { transform: translateY(4px) } }
    @keyframes beat  { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.05) } }

    /* one still, readable frame for anyone who asked the OS to calm motion down */
    @media (prefers-reduced-motion: reduce) {
      .line, .area, .pt, .b1, .b2, .b3, .chip { animation: none }
      .line { stroke-dashoffset: 0 }
      .area, .pt { opacity: 1 }
      .pt { transform: none }
    }
  </style>

  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#0B1D3A" opacity=".055"/>
    </pattern>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#194CFF"/>
      <stop offset="1" stop-color="#00B9F1"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00B9F1" stop-opacity=".34"/>
      <stop offset="1" stop-color="#00B9F1" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1D3A" flood-opacity=".12"/>
    </filter>
    <filter id="lift-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#002E6E" flood-opacity=".26"/>
    </filter>
    <clipPath id="plot"><rect x="128" y="130" width="262" height="172"/></clipPath>
    <radialGradient id="ig" cx="30%" cy="107%" r="150%">
      <stop offset="0" stop-color="#FDF497"/>
      <stop offset="0.05" stop-color="#FDF497"/>
      <stop offset="0.45" stop-color="#FD5949"/>
      <stop offset="0.6" stop-color="#D6249F"/>
      <stop offset="0.9" stop-color="#285AEB"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect width="450" height="390" rx="26" fill="#EEF4FC"/>
  <rect width="450" height="390" rx="26" fill="url(#dots)"/>

  <!-- dashboard -->
  <g filter="url(#lift)">
    <rect x="104" y="58" width="306" height="274" rx="18" fill="#fff"/>
  </g>
  <rect x="104" y="58" width="306" height="274" rx="18" fill="none" stroke="#E6EDF8" stroke-width="1.5"/>
  <path d="M104 96h306" stroke="#EEF2F8" stroke-width="1.5"/>
  <circle cx="126" cy="77" r="5" fill="#FFC24B"/>
  <circle cx="143" cy="77" r="5" fill="#00B9F1"/>
  <circle cx="160" cy="77" r="5" fill="#194CFF" opacity=".55"/>
  <rect x="182" y="70" width="136" height="14" rx="7" fill="#EFF4FB"/>

  <!-- plot -->
  <g stroke="#E8EEF7" stroke-width="1.5" stroke-dasharray="4 7">
    <path d="M128 246h262"/><path d="M128 192h262"/><path d="M128 140h262"/>
  </g>
  <path d="M128 300h262" stroke="#E1EAF5" stroke-width="2"/>

  <g clip-path="url(#plot)">
    <path class="area"
          d="M136 288 L186 266 L236 274 L286 226 L336 200 L384 156 L384 300 L136 300 Z"
          fill="url(#under)"/>
  </g>
  <path class="line" d="M136 288 L186 266 L236 274 L286 226 L336 200 L384 156"
        fill="none" stroke="url(#curve)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#fff" stroke="#00B9F1" stroke-width="2.6">
    <circle class="pt" cx="136" cy="288" r="4.6" style="animation-delay:.10s"/>
    <circle class="pt" cx="186" cy="266" r="4.6" style="animation-delay:.34s"/>
    <circle class="pt" cx="236" cy="274" r="4.6" style="animation-delay:.58s"/>
    <circle class="pt" cx="286" cy="226" r="4.6" style="animation-delay:.82s"/>
    <circle class="pt" cx="336" cy="200" r="4.6" style="animation-delay:1.06s"/>
    <circle class="pt" cx="384" cy="156" r="4.6" style="animation-delay:1.30s" stroke="#194CFF"/>
  </g>

  <!-- value labels: a white halo keeps them legible over the curve and grid -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
     font-size="13" font-weight="700" text-anchor="middle"
     fill="#002E6E" stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round">
    <text class="pt" x="186" y="250" style="animation-delay:.34s">10k</text>
    <text class="pt" x="286" y="210" style="animation-delay:.82s">50k</text>
    <text class="pt" x="336" y="184" style="animation-delay:1.06s">100k</text>
    <text class="pt" x="382" y="140" style="animation-delay:1.30s" fill="#194CFF">500k</text>
  </g>

  <!-- channel badges. Each mark keeps its own brand colour rather than the site palette,
       which is what the platforms' guidelines ask for. -->
  <g class="b1 fl" filter="url(#lift-sm)">
    <circle cx="62" cy="118" r="27" fill="#0A66C2"/>
    <g transform="translate(47 103) scale(1.25)" fill="#fff">
      <circle cx="4.6" cy="4.5" r="2.6"/>
      <path d="M2.3 9h4.6v12H2.3V9Z"/>
      <path d="M9.4 9h4.4v1.6h.06c.8-1.2 2.2-1.9 3.8-1.9 3.2 0 4.64 2 4.64 5.1V21h-4.6v-6.2c0-1.5-.5-2.4-1.8-2.4s-2 .9-2 2.4V21H9.4V9Z"/>
    </g>
  </g>
  <g class="b2 fl" filter="url(#lift-sm)">
    <circle cx="62" cy="196" r="27" fill="#1877F2"/>
    <g transform="translate(47 181) scale(1.25)" fill="#fff">
      <path d="M14.5 21v-8.2h2.8l.4-3.2h-3.2V7.5c0-.9.3-1.6 1.6-1.6h1.7V3c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.4H8v3.2h3.1V21h3.4Z"/>
    </g>
  </g>
  <g class="b3 fl" filter="url(#lift-sm)">
    <circle cx="62" cy="274" r="27" fill="url(#ig)"/>
    <g transform="translate(47 259) scale(1.25)" fill="none" stroke="#fff" stroke-width="2">
      <rect x="4.8" y="4.8" width="14.4" height="14.4" rx="4.6"/>
      <circle cx="12" cy="12" r="3.6"/>
      <circle cx="16.5" cy="7.6" r="1.05" fill="#fff" stroke="none"/>
    </g>
  </g>

  <!-- growth chip -->
  <g class="chip fl" filter="url(#lift-sm)">
    <rect x="322" y="34" width="86" height="38" rx="13" fill="#FFC24B"/>
    <path d="M338 58 l10-11 8 7 12-15" fill="none" stroke="#0B1D3A" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M362 39h9v9" fill="none" stroke="#0B1D3A" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="392" cy="53" r="5" fill="#0B1D3A" opacity=".18"/>
  </g>

  <!-- Platforms strip. Marks are left static and unrecoloured: they are trademarks,
       and the brands' guidelines ask that they are not altered or animated. -->

