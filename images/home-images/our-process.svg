<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-label="A learning path rising through four numbered steps, from a course card to a certificate">
<title>The four steps from choosing a course to a certificate</title>
<defs>
  <linearGradient id="pr-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F2F7FF"/>
    <stop offset="1" stop-color="#E3ECFB"/>
  </linearGradient>
  <linearGradient id="pr-path" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#7FA3FF"/>
    <stop offset="1" stop-color="#194CFF"/>
  </linearGradient>
  <filter id="pr-sh" x="-35%" y="-35%" width="170%" height="180%">
    <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0F2A6B" flood-opacity=".14"/>
  </filter>
  <filter id="pr-sh-sm" x="-45%" y="-45%" width="190%" height="200%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F2A6B" flood-opacity=".13"/>
  </filter>
</defs>

<style>
  .fl{transform-box:fill-box;transform-origin:center}
  .f1{animation:prFloat 6.8s ease-in-out infinite alternate}
  .f2{animation:prFloat 7.6s ease-in-out .5s infinite alternate reverse}
  @keyframes prFloat{from{transform:translateY(-5px)}to{transform:translateY(5px)}}

  /* every hidden state lives in the keyframes, never on the element, so the
     drawing is complete and readable if the animations never run at all */
  .trail{stroke-dasharray:760;animation:prDraw 2.4s .2s ease-out both}
  @keyframes prDraw{from{stroke-dashoffset:760}to{stroke-dashoffset:0}}

  .node{transform-box:fill-box;transform-origin:center;animation:prPop .5s cubic-bezier(.3,1.45,.5,1) both}
  @keyframes prPop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}

  .num{animation:prFade .4s ease-out both}
  @keyframes prFade{from{opacity:0}to{opacity:1}}

  .halo{transform-box:fill-box;transform-origin:center;animation:prPulse 2.8s 2.6s ease-in-out infinite}
  @keyframes prPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.5);opacity:.25}}

  .flag{transform-box:fill-box;transform-origin:bottom left;animation:prFlag .5s 2.5s cubic-bezier(.3,1.4,.5,1) both}
  @keyframes prFlag{from{opacity:0;transform:scale(.4) rotate(-14deg)}to{opacity:1;transform:scale(1) rotate(0)}}

  .tick{stroke-dasharray:20;animation:prTick .5s 2.9s ease-out both}
  @keyframes prTick{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}

  @media (prefers-reduced-motion:reduce){
    .f1,.f2,.trail,.node,.num,.halo,.flag,.tick{animation:none}
  }
</style>

<rect width="600" height="560" rx="18" fill="url(#pr-bg)"/>

<!-- soft depth -->
<circle cx="512" cy="96" r="112" fill="#BFD3FF" opacity=".28"/>
<circle cx="86" cy="472" r="92" fill="#9FC6FF" opacity=".24"/>

<!-- dotted texture -->
<g fill="#9DB4DC" opacity=".45">
  <g id="prdots">
    <circle cx="300" cy="86" r="2.4"/><circle cx="328" cy="86" r="2.4"/><circle cx="356" cy="86" r="2.4"/>
    <circle cx="300" cy="114" r="2.4"/><circle cx="328" cy="114" r="2.4"/><circle cx="356" cy="114" r="2.4"/>
    <circle cx="300" cy="142" r="2.4"/><circle cx="328" cy="142" r="2.4"/><circle cx="356" cy="142" r="2.4"/>
  </g>
  <use href="#prdots" x="-238" y="352"/>
</g>

<!-- the path itself -->
<path class="trail" d="M80 480 C130 470 172 432 215 400 C270 362 300 330 350 275 C405 214 440 186 500 155"
      fill="none" stroke="url(#pr-path)" stroke-width="5" stroke-linecap="round" stroke-dasharray="760"/>

<!-- step 1 -->
<g class="node" style="animation-delay:.55s">
  <circle cx="80" cy="480" r="26" fill="#FFFFFF" stroke="#194CFF" stroke-width="3.5"/>
  <text class="num" style="animation-delay:.85s" x="80" y="487" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#194CFF">1</text>
</g>
<!-- step 2 -->
<g class="node" style="animation-delay:1.1s">
  <circle cx="215" cy="400" r="26" fill="#FFFFFF" stroke="#194CFF" stroke-width="3.5"/>
  <text class="num" style="animation-delay:1.4s" x="215" y="407" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#194CFF">2</text>
</g>
<!-- step 3 -->
<g class="node" style="animation-delay:1.65s">
  <circle cx="350" cy="275" r="26" fill="#FFFFFF" stroke="#194CFF" stroke-width="3.5"/>
  <text class="num" style="animation-delay:1.95s" x="350" y="282" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#194CFF">3</text>
</g>
<!-- step 4, the goal -->
<circle class="halo" cx="500" cy="155" r="30" fill="#194CFF" opacity=".2"/>
<g class="node" style="animation-delay:2.2s">
  <circle cx="500" cy="155" r="26" fill="#194CFF" stroke="#FFFFFF" stroke-width="3.5"/>
  <text class="num" style="animation-delay:2.5s" x="500" y="162" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">4</text>
</g>
<g class="flag">
  <line x1="522" y1="132" x2="522" y2="92" stroke="#0F2A6B" stroke-width="3" stroke-linecap="round"/>
  <path d="M522 95h30l-8 10 8 10h-30z" fill="#FFC24B"/>
</g>

<!-- the course you pick, at the start -->
<g class="fl f1">
  <rect x="48" y="64" width="196" height="126" rx="16" fill="#FFFFFF" filter="url(#pr-sh)"/>
  <rect x="66" y="82" width="160" height="46" rx="9" fill="#E8F0FF"/>
  <path d="M138 96v18l16-9z" fill="#194CFF"/>
  <rect x="66" y="140" width="128" height="10" rx="5" fill="#E7EDF8"/>
  <rect x="66" y="158" width="86" height="9" rx="4.5" fill="#EDF1F9"/>
</g>

<!-- the certificate you leave with -->
<g class="fl f2">
  <rect x="352" y="388" width="202" height="138" rx="16" fill="#FFFFFF" filter="url(#pr-sh-sm)"/>
  <circle cx="392" cy="428" r="19" fill="#FFF3DC"/>
  <path class="tick" d="M384 428l6 6 11-13" fill="none" stroke="#E0952B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M385 445l-6 20 13-7 13 7-6-20z" fill="#FFC24B"/>
  <rect x="424" y="418" width="104" height="10" rx="5" fill="#E7EDF8"/>
  <rect x="424" y="436" width="72" height="9" rx="4.5" fill="#EDF1F9"/>
  <rect x="376" y="486" width="152" height="10" rx="5" fill="#E7EDF8"/>
  <rect x="376" y="504" width="96" height="9" rx="4.5" fill="#EDF1F9"/>
</g>
</svg>
